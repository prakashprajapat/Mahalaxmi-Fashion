version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mfh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahalaxmi_fashionhub
      POSTGRES_USER: postgres
      # No default: the stack refuses to start unless DB_PASSWORD is set (never ship "changeme").
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      # Bind to localhost only — Postgres must NOT be reachable from the public internet.
      # (The backend reaches it over the internal compose network via Host=postgres.)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── .NET Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mfh_backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mahalaxmi_fashionhub;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required}"
      # No default: a guessable JWT key = every login token forgeable. Must be set explicitly.
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required (use a long random string)}
      # Which database ROLE the app connects as. Left empty it falls back to the
      # connection string above, which is the postgres SUPERUSER - and a
      # superuser connection turns any SQL that should not have run into a
      # shell command on this VPS (COPY ... TO PROGRAM). Set BOTH of these to
      # the role from database/least-privilege.sql; the backend ignores one
      # without the other rather than half-applying it, and says at every boot
      # whether it is still a superuser.
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      Jwt__Issuer: MahalaxmiApi
      Jwt__Audience: MahalaxmiFashionHub
      Admin__Email: ${ADMIN_EMAIL:-admin@mahalaxmifashionhub.com}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # Localhost only. nginx on the host proxies to 127.0.0.1:5000; nothing
      # else should reach the API. Published on 0.0.0.0 it was also answering
      # on 147.93.104.150:5000, which let a caller skip Cloudflare entirely and
      # - worse - arrive with a source address of its own choosing as far as
      # the rate limiter was concerned. The frontend container is unaffected:
      # it talks to http://backend:5000 over the compose network, not this port.
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mfh_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
