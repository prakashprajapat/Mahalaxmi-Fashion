name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.104.150
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # The repo lives in mahalaxmi-nextjs; the old path did not exist, so every
            # automatic deploy silently failed and had to be run by hand.
            set -e
            cd /var/www/mahalaxmi-nextjs
            git pull origin main
            # deploy.sh builds the BACKEND as well as the frontend and rolls back on a
            # failed build, so a broken commit can never take the site down.
            ./deploy.sh
